version: 2
models:
- name: stg_benchmark_prices
  description: Validated monthly benchmark observations at source, series and reference-month grain.
  config:
    meta:
      owner: data-platform
      grain: one row per source dataset, benchmark series and reference month
      origin: World Bank monthly Commodity Price Data workbook
      license: World Bank dataset terms; third-party conditions apply and real-observation redistribution is unresolved
      classification: local derived data; source reuse terms still apply
      refresh_expectation: Manual fixture build or explicitly requested live capture/replacement; no scheduled refresh or
        freshness SLA
      provenance: data/parquet/benchmark_prices.json; replacement runs use _revision_state and .state/capture_manifests/<manifest_id>.json
      license_url: https://www.worldbank.org/ext/en/legal/terms-conditions/datasets
      origin_url: https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Monthly.xlsx
    contract:
      enforced: true
  columns:
  - name: source_dataset
    description: Publisher dataset identifier.
    data_type: varchar
    meta:
      unit: none
  - name: series_id
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - cocoa
          - coffee_arabica
          - coffee_robusta
    description: World Bank benchmark series identifier.
    data_type: varchar
    meta:
      unit: none
  - name: period_month
    data_tests:
    - not_null
    description: First day of the source reference month.
    data_type: date
    meta:
      unit: calendar date
  - name: source_value_text
    description: Original source cell text before numeric normalization.
    data_type: varchar
    meta:
      unit: USD/kg text or unavailable marker
  - name: price_usd_per_kg
    description: Nominal monthly benchmark price in USD per kilogram; null represents an unavailable cell.
    data_type: decimal(20,8)
    meta:
      unit: USD/kg
  - name: source_capture_id
    data_tests:
    - not_null
    description: SHA-256 identity of the raw source capture; resolve it in the local capture manifest.
    data_type: varchar
    meta:
      unit: none
  - name: source_status
    description: Workbook cell status when available; null means the workbook did not provide status metadata.
    data_type: varchar
    meta:
      unit: none
- name: stg_trade_observations
  description: Eurostat trade cells with governed product, partner, flow and unit semantics.
  config:
    meta:
      owner: data-platform
      grain: one row per source, reporter, partner, CN8 leaf, flow, indicator and month
      origin: Eurostat Comext DS-045409 monthly trade responses and annual CN mapping
      license: Eurostat reuse terms; attribute Eurostat and access date, identify transformations; Eurostat is not responsible
        for derived calculations
      classification: local derived data; source reuse terms still apply
      refresh_expectation: Manual fixture build or explicitly requested live capture/replacement; no scheduled refresh or
        freshness SLA
      provenance: data/parquet/trade_observations.json; replacement runs use _revision_state and .state/capture_manifests/<manifest_id>.json
      license_url: https://ec.europa.eu/eurostat/help/copyright-notice
      origin_url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/DS-045409
    contract:
      enforced: true
  columns:
  - name: source_dataset
    description: Publisher dataset identifier.
    data_type: varchar
    meta:
      unit: none
  - name: frequency_code
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - M
    description: Publisher frequency code, monthly M.
    data_type: varchar
    meta:
      unit: none
  - name: reporter_code
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - DE
    description: Eurostat reporting geography code, currently DE.
    data_type: varchar
    meta:
      unit: none
  - name: partner_code
    data_tests:
    - not_null
    description: Publisher partner category code; named, special and aggregate classes remain separate.
    data_type: varchar
    meta:
      unit: none
  - name: partner_label
    description: Publisher label for the partner category.
    data_type: varchar
    meta:
      unit: none
  - name: product_code
    data_tests:
    - not_null
    description: Eight-character CN leaf code retained as text.
    data_type: varchar
    meta:
      unit: none
  - name: product_group
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - coffee_unroasted
          - coffee_roasted
          - coffee_extracts
          - coffee_preparations
          - cocoa_beans
          - cocoa_paste
          - cocoa_butter
          - cocoa_powder_unsweetened
          - cocoa_powder_sweetened
          - chocolate_cocoa_preparations
    description: Disjoint analytical group for the CN8 leaf.
    data_type: varchar
    meta:
      unit: none
  - name: classification_code
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - CN
    description: Combined Nomenclature classification identifier, CN.
    data_type: varchar
    meta:
      unit: none
  - name: classification_year
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 2017
          - 2018
          - 2019
          - 2020
          - 2021
          - 2022
          - 2023
          - 2024
          - 2025
          - 2026
    description: Annual CN classification valid for the reference month.
    data_type: smallint
    meta:
      unit: calendar year
  - name: flow_code
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - '1'
          - '2'
    description: 'Eurostat flow code: 1 import, 2 export.'
    data_type: varchar
    meta:
      unit: none
  - name: indicator_code
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - VALUE_IN_EUROS
          - QUANTITY_IN_100KG
    description: Eurostat indicator code for value or quantity.
    data_type: varchar
    meta:
      unit: none
  - name: source_value_text
    description: Original source cell text before numeric normalization.
    data_type: varchar
    meta:
      unit: indicator-dependent; see indicator_code and source_unit
  - name: source_value
    description: Parsed source numeric value in the source indicator unit; null denotes an unavailable cell.
    data_type: decimal(24,4)
    meta:
      unit: indicator-dependent; see indicator_code and source_unit
  - name: source_status
    description: Nullable publisher cell status; absence does not imply a numeric zero.
    data_type: varchar
    meta:
      unit: none
  - name: status_available
    data_tests:
    - not_null
    description: Whether publisher status metadata was supplied for this response.
    data_type: boolean
    meta:
      unit: none
  - name: period_month
    data_tests:
    - not_null
    description: First day of the source reference month.
    data_type: date
    meta:
      unit: calendar date
  - name: source_capture_id
    data_tests:
    - not_null
    description: SHA-256 identity of the raw source capture; resolve it in the local capture manifest.
    data_type: varchar
    meta:
      unit: none
  - name: source_update_time
    data_tests:
    - not_null
    description: Publisher dataset update timestamp, not a per-cell release date.
    data_type: varchar
    meta:
      unit: publisher timestamp text
  - name: partner_class
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - named
          - special
          - aggregate
    description: Named geography, special category or aggregate area.
    data_type: varchar
    meta:
      unit: none
  - name: is_partner_detail
    description: True for named and special partner categories; false for aggregate areas.
    data_type: boolean
    meta:
      unit: none
  - name: comparability_segment
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 2017-2021
          - 2022-2026
          - no identified CN8 leaf break
    description: Within-leaf comparison segment around the known 2022 CN8 scope break.
    data_type: varchar
    meta:
      unit: none
  - name: flow_name
    description: Import or export label for the source flow.
    data_type: varchar
    meta:
      unit: none
  - name: source_unit
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - EUR
          - 100kg
    description: 'Publisher unit for the indicator: EUR or 100kg.'
    data_type: varchar
    meta:
      unit: unit label
  - name: normalized_unit
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - EUR
          - kg
    description: 'Normalized unit for the indicator: EUR or kg.'
    data_type: varchar
    meta:
      unit: unit label
  - name: normalized_value
    description: Value normalized to EUR or kilograms according to the indicator.
    data_type: decimal(34,4)
    meta:
      unit: indicator-dependent; see indicator_code and source_unit

version: 2
models:
- name: int_trade_observations_pivoted
  description: Value and quantity indicators paired at the source coordinate without filling absent cells.
  config:
    meta:
      owner: data-platform
      grain: one row per source, reporter, partner, CN8 leaf, flow and reference month
      origin: Eurostat Comext DS-045409 monthly trade responses and annual CN mapping
      license: Eurostat reuse terms; attribute Eurostat and access date, identify transformations; Eurostat is not responsible
        for derived calculations
      classification: local derived data; source reuse terms still apply
      refresh_expectation: Manual fixture build or explicitly requested live capture/replacement; no scheduled refresh or
        freshness SLA
      provenance: data/parquet/trade_observations.json; replacement runs use _revision_state and .state/capture_manifests/<manifest_id>.json
      license_url: https://ec.europa.eu/eurostat/help/copyright-notice
      origin_url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/DS-045409
    contract:
      enforced: true
  columns:
  - name: source_dataset
    description: Eurostat dataset identifier.
    data_type: varchar
    meta:
      unit: none
  - name: frequency_code
    description: Monthly source frequency.
    data_type: varchar
    meta:
      unit: none
  - name: reporter_code
    description: Reporting geography code.
    data_type: varchar
    meta:
      unit: none
  - name: partner_code
    description: Publisher partner category code.
    data_type: varchar
    meta:
      unit: none
  - name: partner_label
    description: Publisher partner label.
    data_type: varchar
    meta:
      unit: none
  - name: partner_class
    description: Named, special or aggregate partner class.
    data_type: varchar
    meta:
      unit: none
  - name: is_partner_detail
    description: False for aggregate areas.
    data_type: boolean
    meta:
      unit: none
  - name: product_code
    description: CN8 leaf code.
    data_type: varchar
    meta:
      unit: none
  - name: product_group
    description: Disjoint product group.
    data_type: varchar
    meta:
      unit: none
  - name: classification_code
    description: Combined Nomenclature identifier.
    data_type: varchar
    meta:
      unit: none
  - name: classification_year
    description: Applicable CN year.
    data_type: smallint
    meta:
      unit: calendar year
  - name: comparability_segment
    description: Segment around the known 18069090 scope break.
    data_type: varchar
    meta:
      unit: none
  - name: flow_code
    description: One for imports and two for exports.
    data_type: varchar
    meta:
      unit: none
  - name: flow_name
    description: Imports or exports.
    data_type: varchar
    meta:
      unit: none
  - name: period_month
    description: First day of the reference month.
    data_type: date
    meta:
      unit: calendar date
  - name: source_capture_id
    description: Validated response checksum.
    data_type: varchar
    meta:
      unit: none
  - name: source_update_time
    description: Dataset response update timestamp.
    data_type: varchar
    meta:
      unit: publisher timestamp text
  - name: value_cell_present
    description: Whether the value coordinate is represented.
    data_type: boolean
    meta:
      unit: none
  - name: trade_value_eur
    description: Numeric statistical border value in EUR.
    data_type: decimal(24,4)
    meta:
      unit: EUR
  - name: value_status
    description: Nullable publisher status for the value cell.
    data_type: varchar
    meta:
      unit: none
  - name: value_status_available
    description: Whether value status metadata is available.
    data_type: boolean
    meta:
      unit: none
  - name: quantity_cell_present
    description: Whether the mass coordinate is represented.
    data_type: boolean
    meta:
      unit: none
  - name: net_mass_kg
    description: Numeric net mass in kilograms.
    data_type: decimal(34,4)
    meta:
      unit: kg
  - name: quantity_status
    description: Nullable publisher status for the mass cell.
    data_type: varchar
    meta:
      unit: none
  - name: quantity_status_available
    description: Whether mass status metadata is available.
    data_type: boolean
    meta:
      unit: none
  - name: has_numeric_value
    description: Whether value is numeric.
    data_type: boolean
    meta:
      unit: none
  - name: has_numeric_mass
    description: Whether mass is numeric.
    data_type: boolean
    meta:
      unit: none
  - name: has_paired_measures
    description: Whether value and mass are numeric for the same coordinate.
    data_type: boolean
    meta:
      unit: none
  - name: unit_value_eur_per_kg
    description: Value divided by positive paired mass.
    data_type: double
    meta:
      unit: EUR/kg
  - name: value_basis
    description: CIF for imports and FOB for exports.
    data_type: varchar
    meta:
      unit: none

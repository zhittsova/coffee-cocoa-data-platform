version: 2
models:
- name: dim_commodity
  description: The two commodity domains used to conform benchmark and trade facts without equating benchmark series to CN8
    products.
  config:
    meta:
      owner: data-platform
      grain: one row per commodity
      origin: World Bank monthly Commodity Price Data workbook; Eurostat Comext DS-045409 monthly trade responses and annual
        CN mapping
      license: World Bank dataset terms; third-party conditions apply and real-observation redistribution is unresolved; Eurostat
        reuse terms; attribute Eurostat and access date, identify transformations; Eurostat is not responsible for derived
        calculations
      classification: local derived data; source reuse terms still apply
      refresh_expectation: Manual fixture build or explicitly requested live capture/replacement; no scheduled refresh or
        freshness SLA
      provenance: data/parquet/benchmark_prices.json and data/parquet/trade_observations.json; replacement runs use _revision_state
        and .state/capture_manifests/<manifest_id>.json
      license_url: https://www.worldbank.org/ext/en/legal/terms-conditions/datasets; https://ec.europa.eu/eurostat/help/copyright-notice
      origin_url: https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Monthly.xlsx;
        https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/DS-045409
    contract:
      enforced: true
  columns:
  - name: commodity_key
    description: Stable coffee or cocoa key.
    data_tests:
    - not_null
    - unique
    data_type: varchar
    meta:
      unit: none
  - name: commodity_name
    description: Display name for the commodity.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
- name: dim_calendar_month
  description: Monthly calendar from the benchmark start through the contracted trade end bound.
  config:
    meta:
      owner: data-platform
      grain: one row per reference month
      origin: World Bank monthly Commodity Price Data workbook; Eurostat Comext DS-045409 monthly trade responses and annual
        CN mapping
      license: World Bank dataset terms; third-party conditions apply and real-observation redistribution is unresolved; Eurostat
        reuse terms; attribute Eurostat and access date, identify transformations; Eurostat is not responsible for derived
        calculations
      classification: local derived data; source reuse terms still apply
      refresh_expectation: Manual fixture build or explicitly requested live capture/replacement; no scheduled refresh or
        freshness SLA
      provenance: data/parquet/benchmark_prices.json and data/parquet/trade_observations.json; replacement runs use _revision_state
        and .state/capture_manifests/<manifest_id>.json
      license_url: https://www.worldbank.org/ext/en/legal/terms-conditions/datasets; https://ec.europa.eu/eurostat/help/copyright-notice
      origin_url: https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Monthly.xlsx;
        https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/DS-045409
    contract:
      enforced: true
  columns:
  - name: month_key
    description: First day of the reference month.
    data_tests:
    - not_null
    - unique
    data_type: date
    meta:
      unit: calendar date
  - name: calendar_year
    description: Four-digit calendar year.
    data_tests:
    - not_null
    data_type: bigint
    meta:
      unit: calendar year
  - name: calendar_quarter
    description: Calendar quarter number from one through four.
    data_tests:
    - not_null
    data_type: bigint
    meta:
      unit: calendar quarter
  - name: calendar_month
    description: Calendar month number from one through twelve.
    data_tests:
    - not_null
    data_type: bigint
    meta:
      unit: calendar date
  - name: month_label
    description: Reference month formatted as YYYY-MM.
    data_tests:
    - not_null
    - unique
    data_type: varchar
    meta:
      unit: none
- name: dim_trade_product
  description: Supported CN8 leaves expanded to each valid classification year; headings never enter this additive set.
  config:
    meta:
      owner: data-platform
      grain: one row per CN8 leaf and classification year
      origin: Eurostat Comext DS-045409 monthly trade responses and annual CN mapping
      license: Eurostat reuse terms; attribute Eurostat and access date, identify transformations; Eurostat is not responsible
        for derived calculations
      classification: local derived data; source reuse terms still apply
      refresh_expectation: Manual fixture build or explicitly requested live capture/replacement; no scheduled refresh or
        freshness SLA
      provenance: data/parquet/trade_observations.json; replacement runs use _revision_state and .state/capture_manifests/<manifest_id>.json
      license_url: https://ec.europa.eu/eurostat/help/copyright-notice
      origin_url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/DS-045409
    contract:
      enforced: true
  columns:
  - name: product_code
    description: Eight-character CN leaf code retained as text.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
  - name: classification_year
    description: Calendar year whose Combined Nomenclature applies.
    data_tests:
    - not_null
    data_type: bigint
    meta:
      unit: calendar year
  - name: classification_code
    description: Combined Nomenclature identifier, always CN.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - CN
    data_type: varchar
    meta:
      unit: none
  - name: product_group
    description: Disjoint analytical group for the CN8 leaf.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
  - name: trade_product_key
    description: Stable product and classification-year key.
    data_tests:
    - not_null
    - unique
    data_type: varchar
    meta:
      unit: none
  - name: commodity_key
    description: Coffee or cocoa conformed commodity key.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_commodity')
          field: commodity_key
    data_type: varchar
    meta:
      unit: none
  - name: has_2022_scope_break
    description: True only for 18069090, whose source scope changes in 2022.
    data_tests:
    - not_null
    data_type: boolean
    meta:
      unit: none
  - name: comparability_segment
    description: Safe within-leaf comparison segment around the known 2022 scope break.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
- name: dim_trade_partner
  description: Observed Eurostat partner categories classified as named, special or aggregate.
  config:
    meta:
      owner: data-platform
      grain: one row per source dataset, reporter and partner code
      origin: Eurostat Comext DS-045409 monthly trade responses and annual CN mapping
      license: Eurostat reuse terms; attribute Eurostat and access date, identify transformations; Eurostat is not responsible
        for derived calculations
      classification: local derived data; source reuse terms still apply
      refresh_expectation: Manual fixture build or explicitly requested live capture/replacement; no scheduled refresh or
        freshness SLA
      provenance: data/parquet/trade_observations.json; replacement runs use _revision_state and .state/capture_manifests/<manifest_id>.json
      license_url: https://ec.europa.eu/eurostat/help/copyright-notice
      origin_url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/DS-045409
    contract:
      enforced: true
  columns:
  - name: source_dataset
    description: Source dataset identifier.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
  - name: reporter_code
    description: Reporting geography code, currently DE.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
  - name: partner_code
    description: Publisher partner category code.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
  - name: partner_label
    description: Publisher label observed for the partner code.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
  - name: partner_class
    description: Named geography, special category or aggregate area.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - named
          - special
          - aggregate
    data_type: varchar
    meta:
      unit: none
  - name: is_partner_detail
    description: False for aggregate areas and true for named and special categories.
    data_tests:
    - not_null
    data_type: boolean
    meta:
      unit: none
  - name: label_count
    description: Distinct observed labels for the key; values other than one fail the model contract.
    data_tests:
    - accepted_values:
        arguments:
          values:
          - 1
    data_type: bigint
    meta:
      unit: count
  - name: trade_partner_key
    description: Stable source, reporter and partner key.
    data_tests:
    - not_null
    - unique
    data_type: varchar
    meta:
      unit: none

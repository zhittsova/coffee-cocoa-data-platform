    data_type: varchar
    meta:
      unit: none
  - name: month_key
    description: First day of the reference month.
    data_tests:
    - not_null
    data_type: date
    meta:
      unit: calendar date
  - name: classification_year
    description: Calendar year whose CN classification applies.
    data_tests:
    - not_null
    data_type: smallint
    meta:
      unit: calendar year

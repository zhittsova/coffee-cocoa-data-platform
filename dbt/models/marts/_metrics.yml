      enforced: true
  columns:
  - name: metric_name
    description: Stable metric name from model metadata.
    data_tests:
    - not_null
    - unique
    data_type: varchar
    meta:
      unit: none
  - name: model_name
    description: Governed dbt model that publishes the metric.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
  - name: metric_expression
    description: Column or expression that implements the metric.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
  - name: metric_unit
    description: Metric unit or scale.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: unit label
  - name: denominator
    description: Explicit denominator or statement that none applies.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
  - name: coverage
    description: Declared observation universe and material limitations.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none

    data_type: varchar
    meta:
      unit: none
  - name: reporter_code
    description: Reporting geography code.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
  - name: month_key
    description: First day of the reference month.
    data_tests:
    - not_null
    data_type: date
    meta:
      unit: calendar date
  - name: classification_year
    description: Calendar year whose CN classification applies.
    data_tests:
    - not_null
    data_type: smallint
    meta:
      unit: calendar year
  - name: product_group
    description: Disjoint analytical product group.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
  - name: flow_code
    description: One for imports and two for exports.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
  - name: named_partner_value_eur
    description: Numeric value summed across named partners only.
    data_type: decimal(38,4)
    meta:
      unit: EUR
  - name: largest_named_partner_share
    description: Largest observed named-partner value share.
    data_type: double
    meta:
      unit: ratio
  - name: named_partner_hhi
    description: Sum of squared named-partner value shares on a zero-to-one scale.
    data_type: double
    meta:
      unit: ratio squared
  - name: observed_special_value_eur
    description: Numeric value summed across observed special partner codes.
    data_type: decimal(38,4)
    meta:
      unit: EUR
  - name: world_value_eur
    description: Numeric WORLD value across observed leaves.
    data_type: decimal(38,4)
    meta:
      unit: EUR
  - name: reconciliation_residual_eur
    description: WORLD minus named and special observed values, calculated per WORLD-covered leaf before aggregation.
    data_type: decimal(38,4)
    meta:
      unit: EUR
  - name: named_observed_product_count
    description: Leaves with at least one numeric named-partner value.
    data_tests:
    - not_null
    data_type: bigint
    meta:
      unit: count
  - name: special_observed_product_count
    description: Leaves with at least one numeric special-partner value.
    data_tests:
    - not_null
    data_type: bigint
    meta:
      unit: count
  - name: world_observed_product_count
    description: Leaves with a numeric WORLD value.
    data_tests:
    - not_null
    data_type: bigint
    meta:
      unit: count
  - name: named_product_coverage
    description: Sorted leaf signature for numeric named-partner values.
    data_type: varchar
    meta:
      unit: none
  - name: special_product_coverage
    description: Sorted leaf signature for numeric special-partner values.
    data_type: varchar
    meta:
      unit: none
  - name: world_product_coverage
    description: Sorted leaf signature for numeric WORLD values.
    data_type: varchar
    meta:
      unit: none
  - name: concentration_universe
    description: Human-readable named-partner denominator definition.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
  - name: flow_name
    description: Imports or exports.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
  - name: value_basis
    description: CIF for imports and FOB for exports.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
  - name: named_partner_count
    description: Named partners with numeric values; zero when the flow has only special or WORLD context.
    data_tests:
    - not_null
    data_type: bigint
    meta:
      unit: count
  - name: has_positive_named_denominator
    description: Whether the named-partner denominator is positive enough to support shares and HHI.
    data_tests:
    - not_null
    data_type: boolean
    meta:
      unit: none
  - name: observed_special_share_of_world
    description: Observed special value divided by WORLD value when WORLD is positive.
    data_type: double
    meta:
      unit: ratio
  - name: residual_share_of_world
    description: Reconciliation residual divided by WORLD value when WORLD is positive.
    data_type: double
    meta:
      unit: ratio
  - name: reconciliation_status
    description: WORLD availability, coverage mismatch or residual direction.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none

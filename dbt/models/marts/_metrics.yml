- name: monthly_partner_concentration
  description: Named-partner HHI plus separate special, WORLD and reconciliation context with leaf coverage signatures.
  config:
    meta:
      owner: data-platform
      grain: one row per source, reporter, month, product group and flow
      metrics:
      - name: named_partner_hhi
        expression: named_partner_hhi
        unit: ratio squared, zero to one
        denominator: observed numeric value across named partners only
        coverage: named partners and observed CN8 leaves; special codes and aggregates excluded
      - name: reconciliation_residual_eur
        expression: reconciliation_residual_eur
        unit: EUR
        denominator: none; WORLD minus observed named and special values per WORLD-covered leaf
        coverage: WORLD-covered CN8 leaves, with separate coverage signatures for named and special values
      origin: Eurostat Comext DS-045409 monthly trade responses and annual CN mapping
      license: Eurostat reuse terms; attribute Eurostat and access date, identify transformations; Eurostat is not responsible
        for derived calculations
      classification: local derived data; source reuse terms still apply
      refresh_expectation: Manual fixture build or explicitly requested live capture/replacement; no scheduled refresh or
        freshness SLA
      provenance: data/parquet/trade_observations.json; replacement runs use _revision_state and .state/capture_manifests/<manifest_id>.json
      license_url: https://ec.europa.eu/eurostat/help/copyright-notice
      origin_url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/DS-045409
    contract:
      enforced: true

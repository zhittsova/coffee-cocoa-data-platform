version: 2
models:
- name: monthly_benchmark_prices
  description: Nominal USD/kg prices and adjacent observed-month changes, without filling missing months.
  config:
    meta:
      owner: data-platform
      grain: one row per source dataset, benchmark series and reference month
      origin: World Bank monthly Commodity Price Data workbook
      license: World Bank dataset terms; third-party conditions apply and real-observation redistribution is unresolved
      classification: local derived data; source reuse terms still apply
      refresh_expectation: Manual fixture build or explicitly requested live capture/replacement; no scheduled refresh or
        freshness SLA
      provenance: data/parquet/benchmark_prices.json; replacement runs use _revision_state and .state/capture_manifests/<manifest_id>.json
      license_url: https://www.worldbank.org/ext/en/legal/terms-conditions/datasets
      origin_url: https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Monthly.xlsx
    contract:
      enforced: true
  columns:
  - name: source_dataset
    description: World Bank source dataset identifier.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
  - name: series_id
    description: Selected benchmark series identifier.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
  - name: period_month
    description: First day of the reference month.
    data_tests:
    - not_null
    data_type: date
    meta:
      unit: calendar date
  - name: price_usd_per_kg
    description: Nominal benchmark price in USD per kilogram.
    data_type: decimal(20,8)
    meta:
      unit: USD/kg
  - name: source_capture_id
    description: SHA-256 identity of the validated source capture.
    data_tests:
    - not_null
    data_type: varchar
    meta:
      unit: none
  - name: change_usd_per_kg
    description: Difference from the prior calendar month's usable price.
    data_type: decimal(21,8)
    meta:
      unit: USD/kg
  - name: change_percent
    description: Percentage change from the prior calendar month's usable positive price.
    data_type: double
    meta:
      unit: percent

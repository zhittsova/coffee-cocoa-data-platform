[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[project]
name = "coffee-cocoa-platform"
version = "0.0.0"
description = "Local coffee and cocoa data platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster>=1.11,<2",
    "dagster-dbt>=0.27,<1",
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.10,<2",
    "duckdb>=1.4,<2",
    "openpyxl>=3.1,<4",
    "pyarrow>=21,<24",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
forecast = ["numpy>=2,<3"]

[dependency-groups]
dev = [
    "commitizen>=4,<5",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.13,<1",
    "sqlfluff>=4,<5",
    "sqlfluff-templater-dbt>=4,<5",
]
notebooks = [
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
    "matplotlib>=3.9,<4",
]

[tool.ruff]
target-version = "py312"

[tool.commitizen]
name = "cz_customize"

[tool.commitizen.customize]
schema = "<type>: <description>"
schema_pattern = '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test): [^\n()]+(?:\n\n[^\n()]+)?\n?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs the local Dagster and dbt fixture pipeline"]

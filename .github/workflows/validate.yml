name: Validate PR

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-24.04
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          title = os.environ["PR_TITLE"]
          pattern = r"(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test): [^\n\r()]+"
          if not re.fullmatch(pattern, title):
              print("PR title must be an unscoped, single-line conventional subject without parentheses.")
              sys.exit(1)
          PY

  validation:
    name: Locked validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.11"
          enable-cache: false
      - name: Install locked Python and dependencies
        run: |
          uv python install 3.12.14
          uv sync --locked --python 3.12.14
      - name: Check config and lint
        run: uv run --locked pre-commit run --all-files
      - name: Test package
        run: |
          uv run --locked pytest -q -m "not integration"
          uv run --locked python -c "import coffee_cocoa_platform, dagster, dagster_dbt, dbt, duckdb; print('Core imports passed')"
          uv build
      - name: Run offline price pipeline
        env:
          DAGSTER_DISABLE_TELEMETRY: "1"
        run: uv run --locked pytest -q -m integration
